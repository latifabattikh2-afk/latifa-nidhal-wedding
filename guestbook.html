<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guestbook · دفتر التهاني</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="bloom" viewBox="-30 -30 60 60"><g fill="#fff" stroke="#b9c3b4" stroke-width=".8"><ellipse cx="0" cy="-14" rx="8" ry="13"/><ellipse cx="0" cy="-14" rx="8" ry="13" transform="rotate(72)"/><ellipse cx="0" cy="-14" rx="8" ry="13" transform="rotate(144)"/><ellipse cx="0" cy="-14" rx="8" ry="13" transform="rotate(216)"/><ellipse cx="0" cy="-14" rx="8" ry="13" transform="rotate(288)"/></g><circle r="4" fill="#d9c28f"/></symbol></defs></svg>
<div class="ctrl"><button id="lang" type="button">العربية</button></div>
<main>
<div class="frame"><div class="frame-in"><div>
<svg class="bloom"><use href="#bloom"/></svg>
<h2 style="margin-top:14px" data-i18n="gbpTitle">Guestbook</h2>
<p class="small" data-i18n="gbpText">Your words will be read by Latifa and Nidhal.</p>
<form id="gb">
<label><span data-i18n="gbpName">Your name (optional)</span><input name="name" maxlength="80"></label>
<label><span data-i18n="gbpMsg">Your congratulations or prayer</span><textarea name="message" required minlength="2" maxlength="800"></textarea></label>
<button class="btn" type="submit" data-i18n="gbpBtn">Send message</button>
<p class="msg" id="gbMsg" role="status"></p>
</form>
<p><a href="index.html" data-i18n="back">Back to the invitation</a></p>
</div></div></div>
</main>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
