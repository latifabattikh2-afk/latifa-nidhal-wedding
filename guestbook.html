<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guestbook · دفتر التهاني</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Cormorant+Garamond:wght@400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<img class="garden" src="garden.svg" alt="">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="mono" viewBox="-40 -40 80 80"><circle r="37" fill="none" stroke="currentColor" stroke-width="1"/><circle r="34" fill="none" stroke="currentColor" stroke-width=".4"/><g font-family="'Cormorant Garamond',Georgia,serif" font-weight="500" font-size="40" fill="currentColor" text-anchor="middle"><text x="-8" y="12" opacity=".8">L</text><text x="9" y="12">N</text></g></symbol></defs></svg>
<div class="ctrl"><button id="lang" type="button">العربية</button></div>
<main style="padding-top:68px">
<div class="frame"><div class="frame-in"><div>
<svg class="mono"><use href="#mono"/></svg>
<h2 style="margin-top:14px" data-i18n="gbpTitle">Guestbook</h2>
<p class="small" data-i18n="gbpText">Your words will be read by Latifa and Nidhal.</p>
<form id="gb">
<label><span data-i18n="gbpName">Your name (optional)</span><input name="name" maxlength="80"></label>
<label><span data-i18n="gbpMsg">Your congratulations or prayer</span><textarea name="message" required minlength="2" maxlength="800"></textarea></label>
<button class="btn" type="submit" data-i18n="gbpBtn">Send message</button>
<p class="msg" id="gbMsg" role="status"></p>
</form>
<p><a href="index.html" data-i18n="back">Back to the invitation</a></p>
</div></div></div>
</main>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
